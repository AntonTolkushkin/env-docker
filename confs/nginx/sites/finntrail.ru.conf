# Traefik terminates TLS in production. Locally this server is published only
# on 127.0.0.1, so one HTTP virtual host is enough for both modes.

map $http_x_forwarded_proto $effective_scheme {
    default $scheme;
    http http;
    https https;
}

map $effective_scheme $fastcgi_https {
    default off;
    https on;
}

map $effective_scheme $effective_server_port {
    default $server_port;
    https 443;
}

server {
    listen 80;
    listen [::]:80;

    server_name finntrail.ru;
    
    location = /docker-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
 return 301 https://finntrail.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name finntrail.local;

    root /opt/www/public_html;
    index index.php index.html;

    include /etc/nginx/ssl/ssl.conf;

    # Здесь оставьте все существующие Bitrix location/include
    location / {
        try_files $uri $uri/ @bitrix;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location @bitrix {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
    }
}
