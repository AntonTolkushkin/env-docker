# Traefik terminates TLS in production. Locally this server is published only
# on 127.0.0.1, so one HTTP virtual host is enough for both modes.

map $http_x_forwarded_proto $effective_scheme {
    default $scheme;
    http http;
    https https;
}

map $effective_scheme $fastcgi_https {
    default off;
    https on;
}

map $effective_scheme $effective_server_port {
    default $server_port;
    https 443;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/www;
    index index.php index.html;

    # Trust the private Docker ranges used by the reverse proxy, but not arbitrary
    # public peers. Traefik supplies X-Forwarded-For and X-Forwarded-Proto.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    error_page 404 @bitrix;
    error_page 405 =200 @php;
    error_page 500 502 503 504 /500.html;

    location = /docker-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /500.html {
        root /opt/www;
    }

    include /etc/nginx/inc/intranet.conf;
    include /etc/nginx/inc/block.conf;
    include /etc/nginx/inc/static.conf;
    include /etc/nginx/inc/bx_temp.conf;
    # Enable only together with dedicated push-sub/push-pub services.
    # include /etc/nginx/inc/push.conf;
    include /etc/nginx/inc/clouds.conf;
    include /etc/nginx/inc/proxy.conf;
    include /etc/nginx/inc/dav.conf;

    location ~ \.php$ {
        error_page 404 = @php-not-found;
        try_files $uri =404;
        include /etc/nginx/inc/php-fpm.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location @php-not-found {
        return 404;
    }

    location / {
        try_files $uri $uri/ @bitrix;
    }

    location @php {
        include /etc/nginx/inc/php-fpm.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location @bitrix {
        include /etc/nginx/inc/php-fpm.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
    }
}
